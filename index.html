<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ANN Robot Control System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #001f3f, #003366, #00509d);
    overflow:hidden;
}

/* Robot Background */
body::before{
    content:"🤖 🤖 🤖 🤖 🤖 🤖 🤖 🤖 🤖 🤖 🤖 🤖";
    position:absolute;
    font-size:50px;
    opacity:0.08;
    width:100%;
    height:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-around;
    align-items:center;
    animation: float 20s linear infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    100%{transform:translateY(-100px);}
}

.container{
    width:420px;
    background: rgba(255,255,255,0.08);
    border-radius:20px;
    padding:30px;
    backdrop-filter: blur(15px);
    box-shadow:0 0 25px rgba(0,0,0,0.5);
    text-align:center;
    color:white;
    z-index:1;
    animation: fadeIn 1.2s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}

h1{
    font-size:26px;
    margin-bottom:5px;
}

.subtitle{
    font-size:13px;
    color:#cce6ff;
    margin-bottom:20px;
}

.robot{
    font-size:60px;
    animation: bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:0.3s;
}

input:focus{
    box-shadow:0 0 10px #00bfff;
    transform:scale(1.03);
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00bfff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

button:hover{
    background:#0090ff;
    transform:scale(1.05);
}

.result{
    margin-top:20px;
    padding:15px;
    background: rgba(255,255,255,0.15);
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    color:#00ffcc;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow{
    from{box-shadow:0 0 10px #00bfff;}
    to{box-shadow:0 0 20px #00ffcc;}
}

.footer{
    margin-top:15px;
    font-size:11px;
    color:#b3d9ff;
    line-height:1.5;
}

</style>
</head>

<body>

<div class="container">

    <div class="robot">🤖</div>

    <h1>ANN Robot Control System</h1>
    <div class="subtitle">Intelligent Obstacle Avoidance using Artificial Neural Network</div>

    <form action="/predict" method="post">

        <input type="number" step="any" name="f1" placeholder="Front Sensor Distance" required>

        <input type="number" step="any" name="f2" placeholder="Left Sensor Distance" required>

        <input type="number" step="any" name="f3" placeholder="Right Sensor Distance" required>

        <button type="submit">Predict Movement</button>

    </form>

    {% if prediction_text %}
    <div class="result">
        🚀 {{ prediction_text }}
    </div>
    {% endif %}

    <div class="footer">
        ANN-Based Robotics Project (Obstacle Avoidance System)<br>
        © 2026 | Developed by: Muhammad Hamza Qureshi
    </div>

</div>

</body>
</html>
